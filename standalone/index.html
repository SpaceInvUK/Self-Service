<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#372744" />
    <title>cAssistAI · Atendimento que floresce</title>
    <link rel="icon" href="data:," />
    <script>
      // Shows any startup error on screen instead of a blank page.
      window.__cassistShowError = function (msg) {
        var box = document.getElementById("cassist-error");
        if (!box) {
          box = document.createElement("pre");
          box.id = "cassist-error";
          box.style.cssText =
            "position:fixed;left:16px;right:16px;bottom:16px;z-index:99999;margin:0;padding:16px;border-radius:12px;background:#fff4f4;color:#7a1f1f;border:1px solid #e6b3b3;font:14px/1.5 system-ui,sans-serif;white-space:pre-wrap";
          (document.body || document.documentElement).appendChild(box);
        }
        box.textContent =
          "O cAssistAI não conseguiu abrir. Envie esta mensagem para o suporte:\n\n" +
          msg;
      };
      window.addEventListener("error", function (e) {
        window.__cassistShowError(e.message || String(e.error));
      });
      window.addEventListener("unhandledrejection", function (e) {
        window.__cassistShowError(
          String((e.reason && e.reason.message) || e.reason),
        );
      });
    </script>
  </head>
  <body>
    <div id="root">
      <p
        style="
          font:
            16px system-ui,
            sans-serif;
          color: #51345d;
          padding: 32px;
        "
      >
        Abrindo o cAssistAI…
      </p>
    </div>
    <noscript>
      <p
        style="
          font:
            16px system-ui,
            sans-serif;
          padding: 32px;
        "
      >
        Este arquivo precisa ser aberto no Chrome (ou outro navegador) de um
        computador. Visualizadores de arquivo do celular ou do e-mail não
        executam o aplicativo.
      </p>
    </noscript>
    <script type="module" src="./entry.js"></script>
  </body>
</html>
