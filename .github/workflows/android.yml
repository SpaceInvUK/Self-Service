# Builds the Android app (android/) and publishes the APK as a GitHub release.
# Stable download link: https://github.com/SpaceInvUK/Self-Service/releases/latest/download/cAssistAI.apk
name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Same signing key on every build, so a new APK installs over the old one.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cassistai-debug-keystore-v1

      - name: Build APK
        run: gradle -p android assembleDebug -PversionCode=${{ github.run_number }}

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cAssistAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cAssistAI-apk
          path: cAssistAI.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: cAssistAI Android 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            App Android do cAssistAI (abre https://cassistai.duckdns.org).
            Baixe o arquivo cAssistAI.apk no celular e instale (permita "instalar apps de fontes desconhecidas" quando o Android pedir).
          files: cAssistAI.apk
